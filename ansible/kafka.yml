---
# ============================================================================
# Despliega los 3 brokers Kafka en gcp-a (co-alojados con ZooKeeper).
#
# Prerequisitos:
#   - ZooKeeper ensemble levantado (ansible/zookeeper.yml).
#   - Imagen kafka:{{ image_tag }} construida y en Artifact Registry gcp-a.
#
# ansible-playbook -i ansible/inventory.ini ansible/kafka.yml
# ============================================================================

- name: Recopilar facts de nodos gcp-a
  hosts: cloud_gcp_a
  gather_facts: true
  tasks: []

- name: Desplegar brokers Kafka en gcp-a
  hosts: kafka
  gather_facts: false
  roles:
    - docker
    - kafka
