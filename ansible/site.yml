---
# ============================================================================
# Orquestador global de despliegue de WebHardMon.
#
#   ansible-galaxy collection install community.docker
#   tofu apply                      # provisiona + genera ansible/inventory.ini
#   ansible-playbook -i ansible/inventory.ini ansible/site.yml
#
# Orden: seguridad -> servicios base (datos/mensajería) -> aplicaciones.
# Los servicios base aún NO tienen rol de despliegue (solo group_vars). A medida
# que el equipo cree roles/<servicio> + <servicio>.yml, descomenta su línea aquí.
# ============================================================================

# 1) Endurecimiento (cambia el puerto SSH; debe ir PRIMERO).
- import_playbook: security.yml

# 2) Servicios base — roles creados. Dependencias de orden:
#    zookeeper → kafka → schema_registry
#    cassandra  (independiente de ZK/Kafka)
#    mysql      (independiente)
#    harbor     (registro TLS local; lo usan las imágenes de nifi y mapreduce)
#    nifi       (requiere kafka + schema_registry + mysql + harbor)
#    hdfs       (capa cold local; la usan stressscore-bridge, hbase y mapreduce)
#    hbase      (requiere HDFS en nube local)
#    grafana    (requiere cassandra + mysql + hbase)
#    matomo     (independiente)
#    mapreduce  (requiere hbase + HDFS + harbor)
#
# Descomentar en orden para el despliegue completo:
- import_playbook: zookeeper.yml
- import_playbook: kafka.yml
- import_playbook: schema_registry.yml
- import_playbook: cassandra.yml
- import_playbook: mysql.yml
- import_playbook: harbor.yml           # registro TLS local (antes que nifi/mapreduce)
- import_playbook: nifi.yml
- import_playbook: hdfs.yml            # capa COLD: clúster HDFS local (3 nodos Docker)
- import_playbook: hdfs-backup.yml    # backup/restore del NameNode (scripts + cron de backup cada 6 h)
# - import_playbook: hbase.yml          # capa SERVED: requiere HDFS local activo
# - import_playbook: elasticsearch.yml  # pendiente de rol
- import_playbook: grafana.yml
- import_playbook: matomo.yml
# - import_playbook: mapreduce.yml      # batch job: requiere hbase + HDFS

# 3) Aplicaciones (ya tienen rol + playbook).
- import_playbook: stressscore.yml   # nodos RMI + puente (gcp-a)
- import_playbook: web.yml           # panel web (gcp-b)
