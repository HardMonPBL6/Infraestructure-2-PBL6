---
# Crea la tabla webhardmon_hourly (idempotente: comprueba existencia antes).
# Se ejecuta solo en el nodo Master, después de que el Master esté levantado.
#
# Esquema:
#   Tabla   : webhardmon_hourly
#   Row key : {licencia}|{ramGb}|{stoGb}|{yyyyMMddHH}
#   CF      : m  (metrics)
#   Pre-splits: {{ hbase_presplit_regions }} regiones (distribución por primer byte de licencia).

- name: Escribir script HBase en el host temporal
  ansible.builtin.copy:
    content: |
      if exists('{{ hbase_table_name }}')
        puts "Tabla {{ hbase_table_name }} ya existe — nada que hacer"
      else
        splits = (1...{{ hbase_presplit_regions }}).map { |i| (i * 256 / {{ hbase_presplit_regions }}).chr }
        create '{{ hbase_table_name }}',
          { NAME => '{{ hbase_column_family }}',
            VERSIONS => 1,
            TTL => {{ hbase_table_ttl_seconds }},
            BLOOMFILTER => 'ROW',
            DATA_BLOCK_ENCODING => 'FAST_DIFF' },
          { SPLITS => splits }
        puts "Tabla {{ hbase_table_name }} creada con #{splits.length + 1} regiones"
      end
    dest: /tmp/create_hbase_table.rb
    mode: "0644"

- name: Copiar script al contenedor HBase Master
  ansible.builtin.shell: >
    docker cp /tmp/create_hbase_table.rb {{ hbase_master_container }}:/tmp/create_hbase_table.rb
  changed_when: false

- name: Comprobar si la tabla {{ hbase_table_name }} existe
  ansible.builtin.shell: >
    docker exec -e JAVA_TOOL_OPTIONS="-Xmx256m"
    {{ hbase_master_container }} hbase shell -n /tmp/create_hbase_table.rb
  register: hbase_create_result
  changed_when: "'creada' in hbase_create_result.stdout"

- name: Mostrar resultado de creación de tabla
  debug:
    msg: "{{ hbase_create_result.stdout | default('sin salida') }}"
