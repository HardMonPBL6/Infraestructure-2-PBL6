---
# RegionServer solo en el nodo Master (file:// rootdir requiere filesystem compartido).
# Con hbase.rootdir=file:// todos los procesos deben acceder al mismo volumen Docker.

- name: Levantar HBase RegionServer (solo en nodo master, comparte volumen hbase-data)
  community.docker.docker_container:
    name: "{{ hbase_rs_container }}"
    image: "{{ hbase_image }}"
    pull: true
    restart_policy: unless-stopped
    network_mode: host
    env:
      HBASE_ROLE: "regionserver"
      JAVA_TOOL_OPTIONS: "-Xmx{{ hbase_regionserver_heap_mb }}m -Xms{{ hbase_regionserver_heap_mb }}m"
    volumes:
      - "{{ hbase_conf_dir }}/hbase-site.xml:/opt/hbase/conf/hbase-site.xml:ro"
      - "hbase-zk-data:{{ hbase_zk_data_dir }}"
      - "hbase-data:/var/hbase-data"
    state: started
  when: hbase_is_master | bool

- name: Parar HBase RegionServer en nodos no-master (file:// requiere master local)
  community.docker.docker_container:
    name: "{{ hbase_rs_container }}"
    state: absent
    force_kill: true
  when: not (hbase_is_master | bool)
  ignore_errors: true
