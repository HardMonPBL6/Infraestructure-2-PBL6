---
# roles/mapreduce/tasks/main.yml
#
# Despliega el job MapReduce batch en su CT dedicado (10.10.1.24, nube local).
# El job corre como un contenedor Docker EFÍMERO (docker run --rm) que un cron
# horario lanza. La imagen runnable (bde2020/hadoop-base + fat JAR) se construye
# y sube a Harbor con docker/build-and-push.sh ([mapreduce]=local).
#
# Prerequisitos:
#   - roles/docker ejecutado antes en este host (lo encadena ansible/mapreduce.yml).
#   - HDFS corriendo en 10.10.1.21:9000 con datos en {{ mr_hdfs_input_path }}.
#   - HBase desplegado en gcp-b (tabla {{ mr_hbase_table }}).
#   - WireGuard activo: nube local → gcp-b (10.30.0.0/16 alcanzable).

- name: Descargar la imagen del job MapReduce
  community.docker.docker_image:
    name: "{{ mr_image }}"
    source: pull
    force_source: true
  # La imagen es grande (~2 GB) y el pull desde Harbor por la ruta del gateway
  # puede cortarse ("connection reset by peer"). Reintentar evita fallos transitorios.
  register: mr_image_pull
  until: mr_image_pull is succeeded
  retries: 4
  delay: 10

- name: Agregar ruta hacia gcp-b vía gateway WireGuard local
  ansible.builtin.command: "ip route replace {{ mr_hbase_route_cidr }} via {{ mr_local_gateway }}"
  changed_when: false
  failed_when: false

- name: Instalar script de ejecución del job
  ansible.builtin.template:
    src: run-aggregation.sh.j2
    dest: "{{ mr_run_script }}"
    mode: "0755"
    owner: root
    group: root

- name: Configurar cron horario para el job MapReduce
  ansible.builtin.cron:
    name: "webhardmon-mapreduce-aggregation"
    minute: "{{ mr_cron_minute }}"
    hour: "{{ mr_cron_hour }}"
    job: "{{ mr_run_script }} >> /var/log/webhardmon-mr-cron.log 2>&1"
    user: root
    state: present

- name: Confirmar que la imagen está disponible en el host
  community.docker.docker_image_info:
    name: "{{ mr_image }}"
  register: mr_img_info

- name: Mostrar estado del despliegue
  ansible.builtin.debug:
    msg:
      - "Imagen MapReduce: {{ mr_image }} ({{ 'presente' if mr_img_info.images | length > 0 else 'NO encontrada' }})"
      - "Entrada HDFS: {{ mr_hdfs_input }}"
      - "HBase: tabla {{ mr_hbase_table }} — ZK {{ mr_hbase_zk_quorum }}:{{ mr_hbase_zk_port }}"
      - "Cron: cada hora a :{{ mr_cron_minute }} → {{ mr_run_script }}"
