---
# Rol común: instala Docker y autentica contra el registry de la nube.
# Prerequisito de cualquier rol que arranque contenedores.

- name: Instalar Docker
  ansible.builtin.apt:
    name:
      - docker.io
      - python3-docker
      - python3-requests
    update_cache: true
    state: present

- name: Asegurar que el servicio Docker está activo
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Añadir usuarios al grupo docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users | default(['ubuntu']) }}"

# En GCP las VMs se autentican con su service account (roles/artifactregistry.reader);
# el credential helper de gcloud configura Docker para el Artifact Registry de la nube.
- name: Autenticar Docker contra el registry (Artifact Registry vía gcloud)
  ansible.builtin.command: "gcloud auth configure-docker {{ docker_registry_host }} --quiet"
  when: docker_registry_host | default('') | length > 0
  changed_when: false

# En la nube local (Proxmox LXC) el registry es Harbor. Autenticar con la
# contraseña de admin desde vault. Sin esto docker pull falla con 401.
# Sólo en clientes de Harbor (NiFi, MapReduce). En el propio host de Harbor se
# omite: es el servidor del registry, no un cliente, y durante su primer
# despliegue Harbor aún no está arrancado (login fallaría: chicken-and-egg).
- name: Autenticar Docker contra Harbor (nube local)
  ansible.builtin.shell: >
    echo "{{ vault_harbor_admin_password }}" |
    docker login "{{ harbor_registry }}" -u admin --password-stdin
  when:
    - harbor_registry | default('') | length > 0
    - "'harbor' not in group_names"
  # El login a Harbor a veces falla de forma transitoria desde los LXC locales
  # (handshake TLS / ruta vía gateway). Reintentar evita fallos intermitentes.
  register: harbor_login
  until: harbor_login.rc == 0
  retries: 5
  delay: 6
  changed_when: false
  no_log: true
