---
# roles/grafana/tasks/main.yml
#
# Despliega Grafana (singleton, gcp-b node-01, subred pública — red de gestión).
#
# Red de gestión vs datos:
#   - node-01 es el gateway de gcp-b (subred pública 10.30.1.x).
#   - Puerto 3000: accesible desde:
#       · Red gestión: http://10.0.0.30:3000 (WireGuard desde nodo de gestión)
#       · Webapp Spring Boot (mismo nodo, localhost:3000) para dashboards embebidos
#   - Datasources (red de datos/gestión):
#       · Cassandra: 10.20.1.10:9042 (gcp-a, vía WireGuard) — red de datos inter-nube
#       · MySQL:     10.30.2.11:3307 (gcp-b privada, VPC interna) — red de datos local
#       · HBase REST: localhost:8085  (mismo nodo, loopback) — más eficiente

- name: Crear directorio de provisioning de Grafana en el host
  file:
    path: /etc/webhardmon/grafana/provisioning/datasources
    state: directory
    mode: "0755"

- name: Crear directorio para plugins de Grafana
  file:
    path: /etc/webhardmon/grafana/plugins
    state: directory
    mode: "0755"

- name: Crear volumen persistente para dashboards y configuración de Grafana
  community.docker.docker_volume:
    name: grafana-data
    state: present

- name: Renderizar datasources.yml con IPs reales del cluster
  template:
    src: datasources.yml.j2
    dest: /etc/webhardmon/grafana/provisioning/datasources/webhardmon.yml
    mode: "0644"

- name: Levantar Grafana (red gestión gcp-b node-01, puerto 3000)
  community.docker.docker_container:
    name: grafana
    image: "{{ grafana_image }}"
    pull: true
    restart_policy: unless-stopped
    network_mode: host
    env:
      GF_SERVER_ROOT_URL:               "{{ grafana_root_url }}"
      GF_SERVER_HTTP_PORT:              "{{ grafana_port | string }}"
      # Admin: cambiar en producción vía ansible-vault.
      GF_SECURITY_ADMIN_USER:           "admin"
      GF_SECURITY_ADMIN_PASSWORD:       "{{ vault_grafana_admin_password | default('admin') }}"
      GF_SECURITY_ALLOW_EMBEDDING:      "true"
      GF_AUTH_ANONYMOUS_ENABLED:        "false"
      # Plugin JSON datasource para HBase REST (se instala en la imagen o aquí).
      GF_INSTALL_PLUGINS:               "hadesarchitect-cassandra-datasource,marcusolsson-json-datasource"
      GF_PATHS_PROVISIONING:            "/etc/grafana/provisioning"
    volumes:
      - "grafana-data:/var/lib/grafana"
      - "/etc/webhardmon/grafana/provisioning:/etc/grafana/provisioning:ro"
    state: started

- name: Esperar a que Grafana esté disponible (puerto {{ grafana_port }})
  wait_for:
    host: "127.0.0.1"
    port: "{{ grafana_port }}"
    timeout: 60

- name: Verificar API de Grafana
  uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/health"
    method: GET
    status_code: 200
  register: grafana_health
  retries: 5
  delay: 5
  until: grafana_health.status == 200
  changed_when: false

- name: Mostrar URL de acceso a Grafana
  debug:
    msg: "Grafana disponible en http://{{ ansible_host }}:{{ grafana_port }} (user: admin)"
