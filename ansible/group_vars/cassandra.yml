---
# group_vars/cassandra.yml — anillo de 3 (uno por nodo gcp-a).

cassandra_image: "{{ container_registry }}/cassandra:{{ image_tag }}"
cassandra_max_heap_mb: 4096
cassandra_heap_newsize_mb: 800
cassandra_cluster_name: "WebHardMonCluster"
cassandra_keyspace: webhardmon

# Seeds = primeros 2 nodos del grupo (suficiente para bootstrap del anillo).
cassandra_seeds: "{{ cassandra_nodes[:2] | join(',') }}"

# listen/broadcast = IP interna GCP del nodo (accesible via WireGuard entre nubes).
cassandra_listen_address: "{{ inventory_hostname }}"

# Sharding por token (requisito N2): vnodes + RF=3.
cassandra_num_tokens: 16
cassandra_keyspace_replication: "{'class':'SimpleStrategy','replication_factor':3}"
