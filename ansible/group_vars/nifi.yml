---
# group_vars/nifi.yml — NiFi (nube local) + cloudflared para ingesta externa.
#
# El collector corre en PCs de usuario, fuera de las tres nubes. Entra por un
# tunel Cloudflare que termina AQUI (en el CT de NiFi): cloudflared marca
# saliente al edge de Cloudflare y enruta ingest.<zona> -> localhost:nifi.
# OpenTofu crea el tunel y exporta el token; Ansible solo instala el demonio.

nifi_image: "{{ container_registry_local | default('harbor.local/' ~ project_name) }}/nifi:{{ image_tag }}"
# NiFi 2.0 sólo sirve la UI por HTTPS con autenticación (eliminó el modo HTTP
# simple). La UI es interna (red de gestión / LAN), NO pública — el túnel
# Cloudflare expone únicamente el puerto de ingesta. Bind HTTPS en 8443 con
# single-user auth de credenciales deterministas (no la aleatoria de NiFi).
nifi_ui_port: 8443
nifi_single_user_username: "admin"
nifi_single_user_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          65316238663030393136316631373364623632386236336265356165643764353235643435343037
          3564376236666539626563666663353132666666353535380a383730373537303566626131643930
          64643931666264636563353536323837643466613739363632313665386165373366313330306662
          3062623963373239610a303765363261633235666566303731653233653534646161356435386130
          38383765333136346663303031333561666362393234643366393531313331383562
nifi_ingest_port: 8081          # ListenHTTP/HandleHttpRequest — destino del tunel

# --- Avro + Confluent Schema Registry ---------------------------------------
# NiFi serializa a Avro contra el Schema Registry (gcp-a node-01): el controller
# service ConfluentSchemaRegistry apunta a esta URL y los records se publican en
# Kafka con el schema id en la cabecera (wire format Confluent). NiFi vive en la
# nube local -> alcanza node-01 por su IP WireGuard (ansible_host del gateway).
nifi_schema_registry_url: "http://{{ hostvars[schema_registry_node].ansible_host }}:{{ hostvars[schema_registry_node].schema_registry_port | default(8081) }}"

# --- cloudflared (Cloudflare Tunnel) ----------------------------------------
cloudflared_enabled: true
cloudflared_image: "cloudflare/cloudflared:latest"

# Token del conector. NO ponerlo en claro: viene de `tofu output -raw
# cloudflared_tunnel_token`. Inyectar por ansible-vault o variable de entorno
# (p.ej. exportar TF_CLOUDFLARED_TOKEN y pasarlo con -e). Placeholder:
cloudflared_tunnel_token: "{{ vault_cloudflared_tunnel_token | default('') }}"

# Token del túnel de ingesta, refrescado tras el `tofu apply` actual (= `tofu
# output -raw cloudflared_tunnel_token`). Override del de all/vault.yml, que
# quedó obsoleto al recrearse el túnel en el apply nuevo.
vault_cloudflared_tunnel_token: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          37623134393233383462333265653233366264353038313430643231356434393036633565643761
          6337373666376162383138363331623134353363326631640a323336616630366437346363363934
          39616635323064383633646633393863666334613562376262333364376530653931313231313038
          3031636439373537620a343961333930376565626664363138326130353861393830353130323737
          30666538336335363763373461323432323666373633343431303933376434323166653562393130
          61303930373236623935626532343866353037363331613334343335393466636534653761636136
          39356266376531343066373835373833333933353832383739643263626434346634343663373165
          37633032386338346165323434373135333666633866366636636531393866346462643330343331
          39336639626432336133306564333165333766393762356237363339343363303662396632653833
          33346133626163356436343764666632386639366430323666633763396339663230393866366435
          38303465303034373764363564623766316135383037383462343763313862373533396436313732
          38353031306465633433383039343031333736626533383534363766653461656435663034663266
          31353139613135356439303631373365393138393131313362366535323762363938

# El demonio se ejecuta así (rol/handler de Ansible):
#   docker run -d --name cloudflared --restart unless-stopped --network host \
#     {{ cloudflared_image }} tunnel --no-autoupdate run \
#     --token {{ cloudflared_tunnel_token }}
# Con --network host alcanza el listener de NiFi en localhost:{{ nifi_ingest_port }}.

# --- Contrato del collector (PCs de usuario, fuera de Ansible) ---------------
# Los collectors hacen POST a https://ingest.<zona>/<ruta> con las cabeceras del
# service token de Cloudflare Access (salen de `tofu output`):
#   CF-Access-Client-Id:     <collector_access_client_id>
#   CF-Access-Client-Secret: <collector_access_client_secret>
# Estas credenciales se distribuyen con el instalador del collector, no aquí.
