---
# group_vars/mapreduce.yml — configuración del job MapReduce batch.
# Afecta al grupo [mapreduce] (HDFS NameNode, 10.10.1.21, nube local).

# ── Rutas HDFS ───────────────────────────────────────────────────────────────
# Directorio raíz donde el bridge Java escribe los Parquet enriquecidos.
mr_hdfs_input_path: "/data/telemetry"

# ── Conexión HBase (capa served, gcp-b) ──────────────────────────────────────
# IPs accesibles desde la nube local via WireGuard:
#   - node-01 (gateway gcp-b): WireGuard IP 10.0.0.30 → GCP-B interno 10.30.1.10
#   - node-02: 10.30.2.11  (rutado por WireGuard vía gateway local 10.0.0.10)
#   - node-03: 10.30.2.12
mr_hbase_zk_quorum: "10.0.0.30,10.30.2.11,10.30.2.12"
mr_hbase_zk_port: "2181"
mr_hbase_table: "{{ hbase_table_name | default('webhardmon_hourly') }}"

# ── JAR y contenedor ─────────────────────────────────────────────────────────
# Nombre del contenedor HDFS NameNode en el host 10.10.1.21.
mr_namenode_container: "webhardmon-hdfs-namenode"

# Ruta dentro del contenedor donde se copia el JAR.
mr_jar_container_path: "/opt/webhardmon-mr.jar"

# Ruta temporal en el HOST del NameNode para depositar el JAR antes del docker cp.
mr_jar_host_tmp: "/tmp/webhardmon-mr.jar"

# ── Cron schedule ─────────────────────────────────────────────────────────────
# Ejecutar a los 10 minutos de cada hora (da margen para que el bridge flush Parquet).
mr_cron_minute: "10"
mr_cron_hour: "*"

# ── Script de ejecución ───────────────────────────────────────────────────────
mr_run_script: "/usr/local/bin/run-webhardmon-aggregation.sh"

# ── Reducers ──────────────────────────────────────────────────────────────────
# Debe coincidir con el número de regiones HBase pre-spliteadas.
mr_num_reducers: "{{ hbase_presplit_regions | default(8) }}"
