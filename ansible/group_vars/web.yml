---
# group_vars/web.yml — panel web WebHardMon (Spring Boot, capa service). 1 instancia (gcp-b).
# Lee MySQL (telemetriadb; crea tablas con Hibernate ddl-auto:update), Cassandra
# (lectura de mediciones/ordenadores) y embebe dashboards de Grafana.

web_image: "{{ container_registry }}/web:{{ image_tag }}"
web_heap_mb: 768
web_port: 8080

# MySQL (gcp-b).
web_db_host: "{{ hostvars[groups['mysql'][0]].ansible_host }}"
web_db_port: 3307
web_db_name: telemetriadb
web_db_user: webhardmon
web_db_pass: "{{ vault_mysql_app_password }}"

# Cassandra (gcp-a) — contact-points = hosts (sin puerto), puerto aparte.
web_cassandra_contact_points: "{{ cassandra_nodes | join(',') }}"
web_cassandra_port: 9042
web_cassandra_keyspace: webhardmon
web_cassandra_local_dc: datacenter1

# Grafana (gcp-b) — base para los dashboards embebidos en el panel.
web_grafana_base: "http://{{ hostvars[groups['grafana'][0]].ansible_host }}:3000"

# Web app admin credentials
web_admin_password: "{{ vault_web_admin_password }}"
web_superadmin_username: "{{ vault_web_superadmin_username }}"
web_superadmin_password: "{{ vault_web_superadmin_password }}"

# cloudflared (Cloudflare Tunnel) — expone el panel en app.<zona>
# El token viene de `tofu output -raw cloudflared_web_tunnel_token`, añadirlo
# al vault como vault_cloudflared_web_tunnel_token tras el primer `tofu apply`.
web_cloudflared_enabled: true
web_cloudflared_image: "cloudflare/cloudflared:latest"
web_cloudflared_tunnel_token: "{{ vault_cloudflared_web_tunnel_token | default('') }}"

# Token del túnel del panel, refrescado tras el `tofu apply` actual (= `tofu
# output -raw cloudflared_web_tunnel_token`). Override del de all/vault.yml, que
# quedó obsoleto al recrearse el túnel (el connector daba "Tunnel not found").
