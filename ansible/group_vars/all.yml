---
# group_vars/all.yml — válido para TODOS los hosts (locales + GCP).

project_name: webhardmon

# --- Docker -----------------------------------------------------------------
# Todos los servicios corren como contenedores. La instalación de Docker la
# hace un rol común (p.ej. roles/docker) antes de desplegar servicios.
docker_users:
  - ubuntu

# Host del registro que requiere autenticación de Docker. Se sobreescribe por
# nube (Artifact Registry en GCP, Harbor en local). El rol de docker ejecuta el
# credential helper de gcloud:
#   gcloud auth configure-docker {{ docker_registry_host }}
# Las VMs GCP se autentican con su service account (scope cloud-platform +
# roles/artifactregistry.reader sobre el repo, concedido por OpenTofu) — sin
# ficheros de clave en el host.
docker_registry_host: ""

# Presupuesto de RAM del nodo más denso (gcp-a node-02/03). Sirve de tope
# global; cada servicio define su heap dentro de este presupuesto. Ver README.
node_mem_total_mb: 16384
node_mem_reserved_os_mb: 1536   # SO + dockerd + wg-quick

# --- Registro de contenedores ----------------------------------------------
# La URL real por nube la fija OpenTofu (output container_registries). Se
# sobreescribe en group_vars/cloud_gcp_a.yml y cloud_gcp_b.yml. Local usa Harbor.
container_registry: "localhost"          # placeholder; override por nube
image_tag: "1.0"                         # pinear siempre: Spot+DELETE reconstruye VMs; "latest" puede tirar de imagen diferente

# --- Endurecimiento de seguridad (rol security, playbook security.yml) ------
# El rol trae defaults seguros; aquí van los específicos del despliegue.
# Puerto SSH: debe coincidir con var.ssh_port de OpenTofu (ansible_port del
# inventario). Si lo cambias, cámbialo en los dos sitios.
security_ssh_port: 2222
# ignoreip de Fail2ban: el nodo de control de Ansible llega a GCP por la malla
# WireGuard (10.0.0.0/24) y a los CTs locales por la LAN. Se incluyen las /16 de
# cada nube para que ni el gateway ni el control se autobloqueen. Añade aquí la
# IP de tu portátil de gestión si conectas a los CTs locales desde otra subred.
security_fail2ban_ignoreip:
  - 127.0.0.1/8
  - ::1
  - 10.0.0.0/24    # malla WireGuard (nodo de gestión = 10.0.0.1)
  - 10.10.0.0/16   # nube local (Proxmox)
  - 10.20.0.0/16   # gcp-a
  - 10.30.0.0/16   # gcp-b

# --- Helpers de descubrimiento de cluster -----------------------------------
# Resuelven a ansible_host (WireGuard IP para gateways, IP interna GCP para
# nodos privados). Usar SIEMPRE estas listas en lugar de groups['svc'] directamente
# para evitar que los hostnames de inventario se cuelen en configs cross-cloud donde
# no hay DNS que los resuelva (Kafka advertised listeners, ZK quorum, etc.).
zookeeper_ensemble: "{{ groups['zookeeper'] | default([]) | map('extract', hostvars, 'ansible_host') | list }}"
kafka_brokers:       "{{ groups['kafka']     | default([]) | map('extract', hostvars, 'ansible_host') | list }}"
cassandra_nodes:     "{{ groups['cassandra'] | default([]) | map('extract', hostvars, 'ansible_host') | list }}"
hbase_regionservers: "{{ groups['hbase']     | default([]) | map('extract', hostvars, 'ansible_host') | list }}"
schema_registry_node: "{{ (groups['schema_registry'] | default([]) | map('extract', hostvars, 'ansible_host') | list)[0] | default('') }}"
