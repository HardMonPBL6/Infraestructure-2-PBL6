---
# group_vars/hbase.yml — 3 RegionServers (uno por nodo gcp-b).
# node-01 actúa también de Master; node-03 comparte RAM con Elasticsearch, así
# que su heap se recorta vía host_vars si hiciera falta.

hbase_image: "{{ container_registry }}/hbase:{{ image_tag }}"
hbase_regionserver_heap_mb: 3072
hbase_master_heap_mb: 1024

# El primer nodo del grupo es el HMaster; el resto solo RegionServer.
# hbase_master_host = VPC IP de node-01 (alcanzable por todos los RS en gcp-b).
# hbase_is_master compara inventory_hostname (no ansible_host) para evitar
# el mismatch WireGuard-IP vs hostname del patrón cassandra/zookeeper.
hbase_master_node: "{{ (groups['hbase'] | default([]))[0] | default('') }}"
hbase_master_host: "{{ hostvars[hbase_master_node]['ansible_default_ipv4']['address'] | default('10.30.1.10') }}"
hbase_is_master: "{{ inventory_hostname == hbase_master_node }}"

# HBase necesita un quorum ZK. gcp-b no tiene ZK dedicado → quorum embebido en
# los 3 nodos hbase (o apuntar al ensemble de gcp-a vía WireGuard si se prefiere).
hbase_zk_quorum: "{{ hbase_regionservers | join(',') }}"

# Pre-split de regiones (sharding, requisito N2).
hbase_presplit_regions: 8

# ---------------------------------------------------------------------------
# Variables usadas por roles/hbase y por el job MapReduce.
# ---------------------------------------------------------------------------

# ZooKeeper embebido en el contenedor hbase-master (docker/hbase/entrypoint.sh).
# El entrypoint arranca hbase-daemon.sh start zookeeper antes de hbase master start.
# Single-node ZK es suficiente para un clúster HBase sin HA-Master.
hbase_zk_internal_quorum: "10.30.1.10"
hbase_zk_client_port: 2181

# Directorio raíz de HBase: filesystem local del contenedor (volumen Docker hbase-data).
# Nota: se usa file:// porque el Windows gateway no enruta correctamente TCP forwarded
# desde GCP-B hacia 10.10.1.21 (SYN-ACK no llega de vuelta). El job MapReduce
# escribe a HBase vía API client (ZK→Master→RS) sin necesitar HDFS desde GCP-B.
hbase_hdfs_rootdir: "file:///var/hbase-data"

# Tabla de agregados batch creada automáticamente por el rol.
# Row key: {licencia}|{ramGb}|{stoGb}|{yyyyMMddHH}
#   — segmentado por tier de hardware (ramGb, stoGb en GB enteros) para que
#     los percentiles de uso sean comparables entre portátiles de igual capacidad.
hbase_table_name: "webhardmon_hourly"
hbase_column_family: "m"
hbase_table_ttl_seconds: 7776000   # 90 días de retención en la capa served

# Puerto del servidor REST HBase (para webapp/Grafana).
hbase_rest_port: 8085
