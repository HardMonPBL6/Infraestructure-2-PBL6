---
# group_vars/grafana.yml — singleton (gcp-b node-01, público). Capa service / EOD.

grafana_image: "{{ container_registry }}/grafana:{{ image_tag }}"
grafana_port: 3000
grafana_root_url: "http://{{ inventory_hostname }}:3000"

# Datasources de las dos ramas: hot (Cassandra vía tailnet a gcp-a) y
# served/BI (MySQL star schema + Elasticsearch del propio gcp-b).
grafana_datasources:
  - name: cassandra-hot
    type: cassandra
    url: "{{ groups['cassandra'][0] }}:9042"
  - name: mysql-bi
    type: mysql
    url: "{{ groups['mysql'][0] }}:3306"
  - name: elasticsearch
    type: elasticsearch
    url: "http://{{ groups['elasticsearch'][0] }}:9200"

# grafana_admin_password: "{{ vault_grafana_admin_password }}"
