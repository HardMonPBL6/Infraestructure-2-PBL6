---
# group_vars/kafka.yml — 3 brokers (uno por nodo gcp-a), co-alojados con ZK.

kafka_image: "{{ container_registry }}/kafka:{{ image_tag }}"
kafka_heap_mb: 2048
kafka_port: 9092

# broker.id determinista (0..N-1) por posición → mismo id tras preempción.
kafka_broker_id: "{{ groups['kafka'].index(inventory_hostname) }}"

# zookeeper.connect = ensemble local (mismas VMs).
kafka_zookeeper_connect: "{{ zookeeper_ensemble | map('regex_replace', '$', ':2181') | join(',') }}"

# Particionado (requisito N2): >1 partición por topic, RF=3 sobre los 3 brokers.
kafka_default_partitions: 3
kafka_default_replication_factor: 3
kafka_min_insync_replicas: 2

# Listener anunciado = IP interna GCP del nodo (eth0, = ansible_default_ipv4).
# DEBE ser la IP interna, NO ansible_host: para node-01 (gateway) ansible_host es
# su IP WireGuard (10.0.0.20), que node-02/03 NO pueden alcanzar (no corren WG) →
# el controlador no cuenta a node-01 como broker vivo y la creación del topic
# _schemas con RF=3 falla con INVALID_REPLICATION_FACTOR. La IP interna sí sirve
# para todos: inter-broker + intra-VPC (SR, bridge) y también NiFi local, porque
# la malla WireGuard enruta 10.20.0.0/16 hacia la nube local.
kafka_advertised_listener: "PLAINTEXT://{{ ansible_default_ipv4.address }}:{{ kafka_port }}"
